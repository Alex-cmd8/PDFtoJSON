# OCR dla stron bez warstwy tekstowej (skany). Silnik: EasyOCR (Apache 2.0), CPU, bez LLM.
# Instalacja: pip install -r requirements-ocr.txt
# Modele (~100 MB) pobierane są przy pierwszym uruchomieniu do models_dir (potem offline).
enabled: true
languages: [pl]
# skala renderowania strony: 72 dpi * 2 = 144 dpi (wyżej = dokładniej, ale wolniej)
scale: 2.0
min_confidence: 0.15
# parametry detekcji EasyOCR (puste = domyślne). Sprawdzone: low_text 0.3 / text_threshold 0.6
# zachowują krótkie słowa („i”, „w”), ale sklejają kolumny tabel i gubią całe potwierdzenia
# przelewów oraz nagłówki z datą – w sumie wynik gorszy, więc zostają wartości domyślne.
readtext: {}
models_dir: models/easyocr
# strona z mniejszą liczbą znaków w warstwie tekstowej jest traktowana jak skan
min_chars_text_layer: 20
# OCR tylko pierwszych stron (dane kluczowe są na początku pisma); 0 = wszystkie
max_pages: 3
# wątki CPU (0 = wszystkie rdzenie)
threads: 0
# wyniki OCR zapisywane na dysku (ponowne uruchomienie bez powtarzania OCR)
cache_dir: .ocr_cache
