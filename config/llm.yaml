# Ustawienia modelu językowego (opcjonalny fallback dla pól semantycznych).
# Dowolne API zgodne z OpenAI chat completions – zmiana dostawcy = zmiana tego pliku.
#
# Mistral AI (Francja, UE): rodzina Ministral 3 (3B / 8B / 14B) – modele open-weight, Apache 2.0.
# Klucz: zmienna środowiskowa MISTRAL_API_KEY albo plik .env (w .gitignore).
provider: mistral
base_url: https://api.mistral.ai/v1
model: ministral-8b-2512
api_key_env: MISTRAL_API_KEY
allow_anonymous: false
# minimalny odstęp między zapytaniami (limity darmowego planu Mistral)
min_interval: 1.2
json_mode: true
temperature: 0
timeout: 90
max_retries: 4
# odpowiedzi są cache'owane na dysku (powtórne uruchomienie nie kosztuje)
cache_dir: .llm_cache

# Alternatywy (te same pola):
#   OVHcloud AI Endpoints: base_url https://oai.endpoints.kepler.ai.cloud.ovh.net/v1,
#                          model Qwen3.5-9B / gpt-oss-20b, api_key_env OVHCLOUD_API_KEY
#   Scaleway:              base_url https://api.scaleway.ai/v1, api_key_env SCW_SECRET_KEY
