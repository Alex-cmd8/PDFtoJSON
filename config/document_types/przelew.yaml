# Potwierdzenie przelewu bankowego (opłata skarbowa / wpis od odwołania).
# Typ obsługiwany w całości przez generyczny silnik reguł – bez kodu Pythona.
name: przelew
description: Potwierdzenie wykonania przelewu bankowego

classify:
  min_score: 5
  rules:
    - {pattern: 'potwierdzenie\W+(?:\w+\W+){0,3}(?:przelewu|transakcji|operacji)', weight: 4, where: head}
    - {pattern: '(?:polecenie|dowód wykonania) przelewu', weight: 3, where: head}
    # OCR gubi znaki diakrytyczne („Szczególy”, „Szczegoly”)
    - {pattern: 'szczeg[óo][łl]y (?:transakcji|operacji|zlecenia|przelewu)|historia rachunku|wyci[ąa]g z rachunku|potwierdzenie operacji', weight: 3, where: head}
    # nagłówek formularza bankowego: „Przelew krajowy”, „Przelew Elixir”, „Przelew SEPA”
    - {pattern: '^przelew (?:krajowy|zagraniczny|elixir|sepa|natychmiastowy|express)', weight: 3, where: head}
    - {pattern: 'rachun\w* (?:odbiorcy|beneficjenta|nadawcy|zleceniodawcy|obciąż\w*)|na rachunek|z rachunku', weight: 2}
    - {pattern: '\bkwot\w*', weight: 1}
    - {pattern: '\bbank\w*', weight: 1, where: head}
    - {pattern: 'zarzut|pełnomocnikiem|udzielam\w* pełnomocnictwa|krajowej izby', weight: -4}

extractor: rules

# etykiety, które kończą wartość wielolinijkową (np. tytuł przelewu)
stop_labels:
  - 'status'
  - 'waluta'
  - 'kana[łl]'
  - 'tryb'
  - 'typ (?:operacji|transakcji)'
  - 'op[łl]ata'
  - 'nazwa'
  - 'adres'
  - 'data \w+'
  - 'godz\.?'
  - 'nr klienta'
  - 'numer \w+'
  - 'rachunek \w+'
  - 'p[łl]atnik'
  - 'odbiorca'
  - 'beneficjent'
  - 'nadawca'
  - 'zleceniodawca'
  - 'adresat'
  - 'dane \w+'
  - 'szczegó[łl]y'
  - 'z poważaniem'
  # stopki banków (całe zdania – kończą tytuł przelewu)
  - 'bank nie ponosi.*'
  - 'potwierdzenie ma charakter.*'
  - 'dokument (?:wygenerowany|sporządzony|nie wymaga).*'
  - '\*{3}'
  - '-{5,}'

fields:
  z_rachunku:
    type: account
    labels:
      - 'rachun\w* (?:nadawcy|zleceniodawcy|p[łl]atnika|obciąż\w*|źródłow\w*)'
      - 'z rachunku(?: nr)?'
      - '(?:dane )?(?:nadawc\w*|zleceniodawc\w*|p[łl]atnik)'
    patterns:
      - 'z rachunku(?: nr)?:? {v}'
    # bez etykiety nie zgadujemy po kolejności rachunków (rozstrzyga model językowy)
  na_rachunek:
    type: account
    labels:
      - 'rachun\w* (?:odbiorcy|beneficjenta|docelow\w*|adresata|uznan\w*)'
      - 'na rachunek(?: nr)?'
      - '(?:dane )?(?:odbiorc\w*|beneficjent\w*|adresat\w*(?: przelewu)?)'
    patterns:
      - 'na rachunek(?: nr)?:? {v}'
    # bez etykiety nie zgadujemy po kolejności rachunków (rozstrzyga model językowy)
  kwota:
    type: amount
    labels:
      - 'kwot\w*(?: (?:operacji|przelewu|transakcji))?'
      - 'warto[śs][ćc](?: operacji| przelewu)?'
    patterns:
      - 'w kwocie {v}'
  data_operacji:
    type: date
    labels:
      # w kolejności priorytetu: data wykonania operacji > księgowania > zlecenia > waluty
      - 'data (?:operacji|transakcji|wykonania|realizacji)'
      - 'data (?:ksi[ęe]gowania|obci[ąa]żenia)'
      - 'data zlecenia'
      - 'data waluty'
    patterns:
      # tylko konstrukcja z pisma banku: „w dniu X z rachunku nr …”
      - 'w dniu {v},? z rachunku'
  numer_transakcji:
    type: token
    labels:
      - 'numer (?:transakcji|operacji|referencyjny)(?: operacji)?'
      - 'nr (?:ref\.?|referencyjny|transakcji|operacji)'
      - 'identyfikator (?:operacji|transakcji)'
      - 'id (?:operacji|transakcji)'
      - 'identyfikator'
    patterns:
      - '\b(?P<v>CEN\d{8,})'
  tytul:
    type: text
    multiline: true
    labels:
      - 'tytu[łlt] przelewu'
      - 'tytu[łlt]em'
      - 'tytu[łlt]'
      - 'opis(?: operacji| przelewu| transakcji)?'

output:
  przelew_bankowy:
    data_operacji: '{data_operacji}'
    kwota: '{kwota}'
    na_rachunek: '{na_rachunek}'
    numer_transakcji: '{numer_transakcji}'
    tytul: '{tytul}'
    z_rachunku: '{z_rachunku}'

# Pola uzupełniane przez model, gdy ścisłe reguły (etykiety formularza banku) nic nie znalazły.
llm_fill:
  fields:
    z_rachunku: {path: przelew_bankowy.z_rachunku, type: account, opis: "numer rachunku nadawcy / zleceniodawcy (z którego wysłano przelew), 26 cyfr"}
    na_rachunek: {path: przelew_bankowy.na_rachunek, type: account, opis: "numer rachunku odbiorcy / beneficjenta, 26 cyfr"}
    data_operacji: {path: przelew_bankowy.data_operacji, type: date, opis: "data wykonania operacji (nie data wydruku), RRRR-MM-DD"}
    kwota: {path: przelew_bankowy.kwota, type: amount, opis: "kwota przelewu jako liczba (np. 7500.00), bez waluty"}
    tytul: {path: przelew_bankowy.tytul, type: text, opis: "tytuł przelewu (opis płatności), dokładnie jak w dokumencie"}

# Poprawki typowych błędów OCR – stosowane wyłącznie do stron rozpoznanych przez OCR.
# EasyOCR czyta znak minus kwoty obciążenia („-17,00 PLN”) jako cyfrę „2” („217,00”).
# Poprawiamy tylko wtedy, gdy odczytana kwota nie jest kwotą urzędową, a po usunięciu
# wiodącej „2” – jest: opłata skarbowa od pełnomocnictwa 17 zł (i jej wielokrotności),
# wpis od odwołania 7 500 / 10 000 / 15 000 / 20 000 zł (rozporządzenie w sprawie wpisu).
ocr_corrections:
  - path: przelew_bankowy.kwota
    kind: leading_minus_as_2
    known: [17, 34, 51, 68, 85, 102, 7500, 10000, 15000, 20000]
