# Odwołanie do Prezesa Krajowej Izby Odwoławczej.
name: odwolanie
description: Odwołanie wykonawcy od czynności lub zaniechania zamawiającego

classify:
  min_score: 5
  rules:
    # tytuł pisma; OCR: „0 DWOŁ A NIE” (zero zamiast O, przypadkowe spacje)
    - {pattern: '^\s*[O0]\s*D\s*W\s*[O0]\s*[ŁL]\s*A\s*N\s*I\s*E\s*$', weight: 4}
    - {pattern: 'Odwołujący\s*:', weight: 3}
    - {pattern: 'Krajowej Izby Odwoławczej', weight: 1, where: head}
    - {pattern: 'zarzut\w* nr|zarzucam|wnosz[ęe][\s_]+o', weight: 2}
    - {pattern: 'rachun\w* (?:odbiorcy|beneficjenta|nadawcy)|pe[łl]nomocnictwo przyjmuj', weight: -5}
    # orzeczenia KIO, decyzje, poradniki – zawierają słownictwo odwołania, ale nim nie są
    - {pattern: 'Sygn\.\s*akt|^\s*(?:WYROK|POSTANOWIENIE|DECYZJA|UCHWAŁA)\b|Krajowa Izba Odwoławcza\s*[-–]\s*w składzie', weight: -6, where: head}
    - {pattern: 'DECYZJA\s*/\s*POSTANOWIENIE|Izba (?:orzekła|postanawia|umarza)|spis treści|kodeks\w* postępowania administracyjnego', weight: -4}

extractor: odwolanie

options:
  # miasta z polskimi znakami – przywracane, gdy OCR je zgubi („Łódz” → „Łódź”)
  city_names: [Łódź, Kraków, Gdańsk, Poznań, Wrocław, Białystok, Toruń, Rzeszów, Kielce, Częstochowa,
               Bielsko-Biała, Gorzów Wielkopolski, Zielona Góra, Kędzierzyn-Koźle, Jelenia Góra, Tychy,
               Włocławek, Płock, Elbląg, Koszalin, Słupsk, Gliwice, Zabrze, Bytom, Chorzów, Ruda Śląska,
               Rybnik, Świętochłowice, Siemianowice Śląskie, Dąbrowa Górnicza, Jastrzębie-Zdrój, Żory,
               Piła, Łomża, Ostrołęka, Siedlce, Biała Podlaska, Chełm, Zamość, Przemyśl, Tarnów, Nowy Sącz,
               Kraśnik, Mińsk Mazowiecki, Wałbrzych, Legnica, Głogów, Świdnica, Gniezno, Leszno, Kalisz,
               Konin, Grudziądz, Inowrocław, Łódź, Pruszków, Piotrków Trybunalski, Skierniewice, Łowicz,
               Sieradz, Zgierz, Pabianice, Bełchatów, Suwałki, Ełk, Giżycko, Świnoujście, Gdynia, Sopot,
               Szczecin, Olsztyn, Lublin, Opole, Katowice, Bydgoszcz, Radom, Sosnowiec, Warszawa]
  # nagłówki sekcji stron (początek linii, WIELKOŚĆ LITER ISTOTNA: „zamawiających:” z zawiniętego
  # pod-nagłówka ani „działający przez…” nie są nagłówkami)
  section_headers:
    # odporne na typowe zniekształcenia OCR: „Odwolujący”, „Odwołujacy”, „Odwohujacy”, szum przed etykietą
    odwolujacy: '^\W{0,3}(?:[a-z]{0,12})?Odwo[łlh]uj[ąa]c\w*(?:\s*\(.*?\))?\s*:?'
    zamawiajacy: '^\W{0,3}(?:[a-z]{0,12})?Zamawia[ji][ąa]c\w*(?:\s*\(.*?\))?\s*:?'
    inne: '^(?:Prezes Krajowej Izby|Krajowa Izba Odwo|Wykonawca wybrany|Przystępując\w*|Uczestni\w*|[Dd]otyczy|O\s?D\s?W\s?O\s?[ŁL]\s?A\s?N\s?I\s?E|Działając|Wartość zamówienia|Wpis od)'
  # linie, które nie są nazwą podmiotu (adres, identyfikatory, kontakt)
  # (także każda linia z kodem pocztowym, np. „Rynek 1, 45-015 Opolec” – adres bez „ul.”)
  non_name_line: '^\W{0,2}(?:ul\.|al\.|pl\.|os\.|aleja|\d{2}-\d{3}|KRS|NIP|REGON|tel\.|e-mail|adres|reprezentowan|przedsiębiorca|prowadząc|wpisan|działając|[\w.+-]+@)|.*,\s*\d{2}-\d{3}\s+\S'
  # pod-nagłówki podmiotów w sekcji (konsorcjum, zamawiający wspólni)
  # pod-nagłówek „N) …:”; może być zawinięty na 2 linie (druga linia zaczyna się małą literą)
  entity_subheader: '^\d+\)\s*.*:\s*$'
  entity_subheader_start: '^\d+\)\s*(?:Zamawiając|Wykonawc|Lider|Partner|Członek|Uczestnik|Konsorcj)'
  leader_rx: 'lider|prowadząc\w* postępowanie'
  # nagłówek pisma: „Miejscowość, dnia DD.MM.RRRR” – szukany na stronach 0..header_max_page
  header_max_page: 0
  # strefa z danymi zamówienia (BZP, TED, nr referencyjny, tytuł) – żeby nie łapać numerów
  # innych postępowań przywołanych w uzasadnieniu
  zone_start: '\bdotyczy\b'
  zone_end: 'Działając w imieniu|\bwnosz[ęe]\b|\bZarzut\w*\b|zarzucam|Wartość zamówienia'
  # układ tabelaryczny stron („Strona | Pole | Dane”) zamieniany na zwykłe linie sekcji
  table_layout:
    parties:
      'Odwołując': 'Odwołujący:'
      'Zamawiając': 'Zamawiający:'
      'Pełnomocnik': pelnomocnik   # wiersze dopisywane do sekcji odwołującego
    fields:
      'Nazwa': '{v}'
      'Adres': '{v}'
      'KRS': 'KRS: {v}'
      'NIP': 'NIP: {v}'
      'REGON': 'REGON: {v}'
      'E-?mail': 'e-mail: {v}'
      'Osoba': 'reprezentowany przez: {v}'
      'Kancelaria': 'adres do korespondencji: {v}'
  # zdanie z zaskarżoną czynnością; {date} = data czynności.
  # Poziomy sprawdzane po kolei: kolejny poziom tylko gdy poprzedni nic nie sklasyfikował.
  action_triggers:
    - - 'Zamawiający\s+w\s+dniu\s+{date}'
    # petitum: „Wnoszę odwołanie od/wobec czynności … w dniu <data>” – klasa = najwcześniej
    # wymieniona czynność w zdaniu, data = pierwsza data w zdaniu (z pominięciem dat ustaw)
    - mode: petitum
      patterns:
        - '(?-i:W)nosz[ęe]\s+odwołanie'
        - '(?-i:O)dwołanie\s+wnosz[ęe]'
        - 'odwołanie\s+(?:od|wobec)\s+(?:czynności|zaniechani)'
        - '(?-i:Z)askarżam'
        - '(?-i:O)dwołujący\s+(?:kwestionuje|zaskarża|zarzuca)'
        # pierwsze zdanie po tytule pisma (O D W O Ł A N I E) to zwykle petitum
        - '(?-i:O\s?D\s?W\s?O\s?Ł\s?A\s?N\s?I\s?E)(?!\s*(?:dotyczy|Działając))\s'
    - - '(?:^|[.;:]\s+)(?-i:W)\s+dniu\s+{date}\s*(?:r\.|roku)?,?\s+Zamawiający'
      - '(?:^|[.;:]\s+)(?-i:P)ismem\s+z\s+dnia\s+{date}\s*(?:r\.|roku)?,?\s+Zamawiający'
      - 'Zamawiający,?\s+(?:pismem|w\s+piśmie|w\s+informacji|informacją)\s+z\s+dnia\s+{date}'
      - '(?:^|[.;:]\s+)(?-i:D)nia\s+{date}\s*(?:r\.|roku)?,?\s+Zamawiający'

fields:
  numer_bzp:
    type: bzp
    patterns: ['{v}']
  numer_ted:
    type: ted
    patterns:
      - '(?:TED|Dzienniku Urzędowym (?:UE|Unii Europejskiej)|Dz\.\s?Urz\.\s?UE|OJ S)\D{0,60}?{v}'
  numer_postepowania:
    type: token
    patterns:
      - '(?:nr|numer)\s*ref(?:erencyjn\w*|\.)(?: sprawy| postępowania)?\s*:?\s*{v}'
      - '(?:nr|numer) postępowania\s*:?\s*{v}'
      - '(?:nr|numer|znak|oznaczenie) sprawy\s*:?\s*{v}'
      - 'znak postępowania\s*:?\s*{v}'
      - 'postępowani\w* nr\s*{v}'
  tytul:
    type: text
    # tytuł w cudzysłowie; dopuszczalny jeden poziom zagnieżdżonych cudzysłowów („Hala „Arena” w X”)
    # oraz dwukropek po „pn.” / „pod nazwą”
    patterns:
      - '\bpn\.\s*:?\s*[„"](?P<v>(?:[^„”"]|„[^„”"]*”){5,400})[”"]'
      - 'pod nazwą\s*:?\s*[„"](?P<v>(?:[^„”"]|„[^„”"]*”){5,400})[”"]'

# Model językowy dla zaskarżonej czynności (ustawienia połączenia: config/llm.yaml).
# mode: off | fallback (LLM tylko gdy reguły nie znalazły zdania z czynnością) | always
llm:
  mode: fallback
  # w trybie fallback reguła rozstrzyga tylko dla tych poziomów action_triggers (0 = „Zamawiający w dniu …”);
  # pozostałe (petitum, synonimy, brak wyzwalacza) rozstrzyga model
  trust_rule_tiers: [0]
  max_chars: 8000
  system_prompt: |
    Jesteś ekspertem od prawa zamówień publicznych (ustawa Pzp). Analizujesz odwołania do Krajowej
    Izby Odwoławczej. Odpowiadasz wyłącznie obiektem JSON, bez komentarzy.
  user_prompt: |
    Ustal czynność (lub zaniechanie) zamawiającego zaskarżoną w poniższym odwołaniu – tę, od której
    liczy się termin na wniesienie odwołania. Najczęściej opisuje ją zdanie w rodzaju
    „Zamawiający w dniu <data> <czynność>”. Nie myl jej z czynnościami wcześniejszymi
    (np. „Uprzednio, w dniu …”, wezwania do wyjaśnień, otwarcie ofert).

    Wybierz dokładnie jedną kategorię z listy (id: opis):
    {classes}

    Zwróć JSON:
    {{"czynnosc_powod_id": <numer kategorii z listy (liczba przed dwukropkiem) albo null>,
      "czynnosc_opis": "<opis tej kategorii skopiowany dokładnie z listy>",
      "czynnosc_dzien": "<data tej czynności w formacie RRRR-MM-DD albo null>",
      "cytat": "<DOSŁOWNIE skopiowany fragment tekstu (bez zmian i skrótów), na którym opierasz decyzję, razem z datą>"}}

    Datą czynności jest data, w której zamawiający jej dokonał lub poinformował o niej – także gdy stoi
    w nawiasie albo w dalszej części zdania (np. „informacja z dnia …”, „zawiadomienie z …”).
    Nie podawaj daty ustawy (np. „ustawy z dnia 11 września 2019 r.”). Zwróć null tylko, gdy daty naprawdę nie ma.

    Tekst odwołania:
    """
    {text}
    """

# Pola uzupełniane przez model, gdy ścisłe reguły nic nie znalazły (patrz odwolania2json/llm_fill.py).
llm_fill:
  fields:
    odwolujacy_nip: {path: "Odwolujacy[0].nip", type: nip, opis: "NIP odwołującego (przy konsorcjum – lidera), nie kancelarii"}
    odwolujacy_krs: {path: "Odwolujacy[0].krs", type: krs, opis: "KRS odwołującego (przy konsorcjum – lidera), nie kancelarii; null jeśli brak", only_if_null: ["Odwolujacy[0].nip"]}
    odwolujacy_regon: {path: "Odwolujacy[0].regon", type: regon, opis: "REGON odwołującego (przy konsorcjum – lidera); null jeśli brak", only_if_null: ["Odwolujacy[0].nip"]}
    odwolujacy_nazwa:
      path: "Odwolujacy[0].nazwa"
      type: text
      opis: "pełna nazwa odwołującego (wykonawcy wnoszącego odwołanie); przy konsorcjum – nazwa lidera; bez adresu i dopisków"
    zamawiajacy_nazwa:
      not_equal: "Odwolujacy[0].nazwa"
      path: "Zamawiajacy[*].nazwa"
      type: text
      opis: "pełna nazwa tego zamawiającego (bez adresu i dopisków)"
      context: "nip"
    przez_pelnomocnika:
      path: "Odwolujacy[0].przez-pelnomocnika"
      type: flag01
      opis: "1 jeśli odwołującego reprezentuje pełnomocnik (adwokat / radca prawny), 0 jeśli działa sam lub przez członków zarządu"
    pelnomocnik_osoba:
      path: "Odwolujacy[0].pelnomocnik.imie_nazwisko"
      type: person
      opis: "imię i nazwisko PIERWSZEGO pełnomocnika odwołującego (adwokata / radcy prawnego), w mianowniku; null jeśli brak pełnomocnika"
      skip_if: {"Odwolujacy[0].przez-pelnomocnika": 0}
    pelnomocnik_kancelaria:
      path: "Odwolujacy[0].pelnomocnik.nazwa"
      type: text
      opis: "nazwa kancelarii / podmiotu, w którym pracuje pełnomocnik odwołującego"
      skip_if: {"Odwolujacy[0].przez-pelnomocnika": 0}
    pelnomocnik_mail:
      path: "Odwolujacy[0].pelnomocnik.mail"
      type: email
      opis: "adres e-mail pełnomocnika odwołującego"
      skip_if: {"Odwolujacy[0].przez-pelnomocnika": 0}
    tytul_zamowienia:
      path: ZamowieniePubliczne.tytul
      type: text
      opis: "tytuł (nazwa) zamówienia publicznego, którego dotyczy odwołanie, bez cudzysłowów"
    numer_postepowania:
      path: ZamowieniePubliczne.numer_postepowania
      type: code
      opis: "numer referencyjny / znak sprawy postępowania nadany przez zamawiającego (np. ZP.271.5.2026)"
